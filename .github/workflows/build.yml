name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLAYDATE_SDK_VERSION: 3.1.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf
          rustup default stable

      - name: Cache Playdate SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/PlaydateSDK
          key: playdate-sdk-linux-${{ env.PLAYDATE_SDK_VERSION }}

      - name: Download Playdate SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/PlaydateSDK
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar xz -C ~/PlaydateSDK --strip-components=1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Stamp version
        run: |
          # Sideloaded updates only install over a lower buildNumber.
          sed -i "s/^buildNumber=.*/buildNumber=${GITHUB_RUN_NUMBER}/" Source/pdxinfo
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sed -i "s/^version=.*/version=${GITHUB_REF_NAME#v}/" Source/pdxinfo
          fi
          cat Source/pdxinfo

      - name: Build
        run: PLAYDATE_SDK_PATH=~/PlaydateSDK make device

      - name: Package
        run: zip -r BBKEmu.pdx.zip BBKEmu.pdx

      - uses: actions/upload-artifact@v4
        with:
          name: BBKEmu.pdx
          path: BBKEmu.pdx.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from the annotated tag's message. checkout can leave the
          # tag lightweight, so fetch the real tag object first.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" BBKEmu.pdx.zip \
            --title "BBKEmu for Playdate $GITHUB_REF_NAME" \
            --notes-from-tag
