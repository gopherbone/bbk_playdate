[package]
name = "bbkemu-pd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "C ABI over a no_std bbkemu-core for the Playdate frontend"

[lib]
name = "bbkemu_pd"
crate-type = ["staticlib"]

[dependencies]
# Generated by the Makefile: upstream bbkemu-core with patches/bbkemu-core-nostd.patch applied.
bbkemu-core = { path = "../gen/bbkemu-core" }
mos6502 = { version = "0.10", default-features = false }
# Strip every log call from the core; several sit on the per-instruction path.
log = { version = "0.4", default-features = false, features = ["max_level_off", "release_max_level_off"] }

# Standalone workspace so the upstream submodule stays untouched.
[workspace]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
